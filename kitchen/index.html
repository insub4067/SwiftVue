<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The playground blocks zoom outright for a native feel. Kitchen does
         not, because one of its jobs is checking accessibility and pinch
         zoom is the only way some people can read a screen at all. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SwiftVue Kitchen</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
